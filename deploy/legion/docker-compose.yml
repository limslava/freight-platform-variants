name: freight-platform-sites

services:
  movibids-site:
    build:
      context: ../..
      dockerfile: deploy/legion/Dockerfile
      args:
        SITE_PATH: variants/movibids
    environment:
      BRAND: MoviBids
      FORMS_ENABLED: "false"
      LEADS_FILE: /data/leads.jsonl
    volumes:
      - ./data/movibids:/data
    networks:
      - web
    restart: unless-stopped

  frevigo-site:
    build:
      context: ../..
      dockerfile: deploy/legion/Dockerfile
      args:
        SITE_PATH: variants/frevigo
    environment:
      BRAND: FreVigo
      FORMS_ENABLED: "false"
      LEADS_FILE: /data/leads.jsonl
    volumes:
      - ./data/frevigo:/data
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: second-brain_default
